<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="complex-poly" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="none"/>
      
      <!-- Base Grid (Hexagons) - Deep Space Blue -->
      <path d="M50 0 L100 25 L100 75 L50 100 L0 75 L0 25 Z" fill="none" stroke="#1D3557" stroke-width="1.5" opacity="0.3"/>
      
      <!-- Interlocking Triangles - Strawberry Red -->
      <path d="M50 20 L80 65 H20 Z" fill="none" stroke="#E63946" stroke-width="1.5" opacity="0.6"/>
      <path d="M50 80 L80 35 H20 Z" fill="none" stroke="#E63946" stroke-width="1.5" opacity="0.6"/>
      
      <!-- Connecting Lines/Stars - Steel Blue -->
      <path d="M50 0 V20 M100 25 L80 35 M100 75 L80 65 M50 100 V80 M0 75 L20 65 M0 25 L20 35" stroke="#457B9D" stroke-width="1.5" opacity="0.5"/>
      
      <!-- Center Detail - Frosted Blue Fill -->
      <circle cx="50" cy="50" r="10" fill="#A8DADC" opacity="0.4"/>
      <circle cx="0" cy="0" r="10" fill="#A8DADC" opacity="0.4"/>
      <circle cx="100" cy="0" r="10" fill="#A8DADC" opacity="0.4"/>
      <circle cx="0" cy="100" r="10" fill="#A8DADC" opacity="0.4"/>
      <circle cx="100" cy="100" r="10" fill="#A8DADC" opacity="0.4"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#complex-poly)" />
</svg>
