        <path d="M50 5 L72 17.5 L72 25 L50 37.5 L28 25 L28 17.5 Z" transform="rotate(120 50 50) translate(0 -20)" />
        <path d="M50 5 L72 17.5 L72 25 L50 37.5 L28 25 L28 17.5 Z" transform="rotate(180 50 50) translate(0 -20)" />
        <path d="M50 5 L72 17.5 L72 25 L50 37.5 L28 25 L28 17.5 Z" transform="rotate(240 50 50) translate(0 -20)" />
        <path d="M50 5 L72 17.5 L72 25 L50 37.5 L28 25 L28 17.5 Z" transform="rotate(300 50 50) translate(0 -20)" />
