      <g fill="none" stroke="#457B9D" stroke-width="1" opacity="0.4">
        <!-- Center Hexagon -->
        <path d="M50 25 L72 37.5 L72 62.5 L50 75 L28 62.5 L28 37.5 Z" />
        
        <!-- Surrounding Ring -->
        <path d="M50 5 L72 17.5 L72 25 L50 37.5 L28 25 L28 17.5 Z" transform="translate(0 -20)" />
